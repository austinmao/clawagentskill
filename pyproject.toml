[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clawagentskill"
version = "0.2.0"
description = "Agent & skill discovery, security scanning, and adoption for OpenClaw"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
clawagentskill = "clawagentskill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clawagentskill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
